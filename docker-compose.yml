version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: gateway_load_balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2

  gateway-1:
    build: .
    environment:
      - PORT=3000
      - INSTANCE_ID=gateway-node-1
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://mock-backend:3001
    depends_on:
      - redis
      - mock-backend

  gateway-2:
    build: .
    environment:
      - PORT=3000
      - INSTANCE_ID=gateway-node-2
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://mock-backend:3001
    depends_on:
      - redis
      - mock-backend

  mock-backend:
    build: .
    container_name: mock_downstream_service
    command: ["node", "mock-backend/server.js"]
    ports:
      - "3001:3001"

  redis:
    image: redis:alpine
    container_name: redis_state_store
    ports:
      - "6379:6379"